services:
  - type: web
    name: neuroai-diagnostic-platform
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.4
      - key: MPLCONFIGDIR
        value: /tmp/matplotlib
